<!doctype html>
<!-- SYNTHETIC fixture — the SPA Sign In page (/login). Username + password
     textboxes + Sign In button; no ticket field buttons. No PII. -->
<html lang="en">
<head><title>Login - Support Portal</title></head>
<body>
<main>
  <div class="login-card">
    <img alt="Contoso Group of Companies" src="logo.png">
    <h2>Sign In</h2>
    <form>
      <div class="field"><input type="text" name="username" placeholder="Username" aria-label="Username"></div>
      <div class="field"><input type="password" name="password" placeholder="Password" aria-label="Password">
        <button type="button" aria-label="toggle password"></button>
      </div>
      <button type="submit" disabled>Sign In</button>
    </form>
  </div>
</main>
</body>
</html>
