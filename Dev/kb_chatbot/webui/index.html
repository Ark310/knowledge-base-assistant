<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoso KB Guru</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="navToggle" title="Show or hide chats" aria-label="Toggle chat history">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">
        <div class="mark"><span>ds</span></div>
        <div><h1>KB Guru</h1><div class="sub">CONTOSO KNOWLEDGE ASSISTANT · v3.0.1</div></div>
      </div>
      <div class="grow"></div>
      <div class="ctrls">
        <div class="field hide-sm">
          <label for="product">Product</label>
          <div class="select"><select id="product"></select></div>
        </div>
        <div class="field">
          <label for="provider">Reasoning</label>
          <div class="prov"><span class="dot" id="provdot" title="Ready"></span>
            <div class="select"><select id="provider"></select></div>
          </div>
        </div>
        <div class="field hide-sm">
          <label for="model">Model</label>
          <div class="select"><select id="model"></select></div>
        </div>
        <button class="btn primary" id="newtop" title="Start a new chat">+ New chat</button>
        <button class="icon-btn src-toggle on" id="srcToggle" title="Show or hide sources" aria-label="Toggle sources panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </div>
    </header>

    <div class="body" id="body">
      <aside class="col history">
        <button class="btn primary newchat" id="newchat">+ New chat</button>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
          <input placeholder="Search chats" id="chatsearch" aria-label="Search chats"/>
        </div>
        <div class="col-head"><h2>Recent</h2></div>
        <div class="chats" id="chats"></div>
      </aside>

      <main class="col chat-col">
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="Ask about a product, error, or ticket… (e.g. “GetWebDeal returns null buy amount”)"></textarea>
            <button class="send" id="send" title="Send" aria-label="Send">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h15m-6-7 7 7-7 7"/></svg>
            </button>
            <button class="send stop" id="stop" title="Stop generating" aria-label="Stop" style="display:none">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <div class="hint">Answers cite the tickets &amp; KB they draw from — check the Sources panel. The bot abstains when it isn't in the knowledge base.</div>
        </div>
      </main>

      <aside class="col sources">
        <div class="col-head"><h2>Sources for this answer</h2><span id="srccount" style="font-size:11px;color:var(--ink-faint)"></span></div>
        <div class="src-list" id="srclist"><div class="src-empty">Sources for an answer will appear here.</div></div>
        <details class="hood" id="hood" style="display:none">
          <summary>Under the hood <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m9 6 6 6-6 6"/></svg></summary>
          <dl class="kv" id="hoodkv"></dl>
        </details>
      </aside>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
